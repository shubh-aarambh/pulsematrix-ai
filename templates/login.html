<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PulseMatrix AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-icon">⚡</span>
            <h2>Pulse<span class="brand-accent">Matrix</span> AI</h2>
            <p class="auth-subtitle">Autonomous Financial Intelligence Platform</p>
        </div>

        {{if .Error}}
        <div class="alert alert-danger">{{.Error}}</div>
        {{end}}

        <form action="/login" method="POST" class="auth-form">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username or email" required autofocus>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In to Dashboard &rarr;</button>
        </form>

        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a href="/register" class="link-accent">Create Enterprise Account</a>
        </div>
    </div>
</body>
</html>
