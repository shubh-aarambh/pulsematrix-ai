<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PulseMatrix AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-icon">⚡</span>
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join PulseMatrix Financial Intelligence Platform</p>
        </div>

        {{if .Error}}
        <div class="alert alert-danger">{{.Error}}</div>
        {{end}}

        <form action="/register" method="POST" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. alex_quant" required autofocus>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="alex@company.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Initialize Enterprise Account &rarr;</button>
        </form>

        <div class="auth-footer">
            <span>Already registered?</span>
            <a href="/login" class="link-accent">Sign In</a>
        </div>
    </div>
</body>
</html>
